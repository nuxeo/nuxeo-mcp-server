name: Update Python and uv

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@16298278308f674c76542d61658da190e975e31c # v19.16.0

      # uv lock, run by updatecli when requires-python changes
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # updatecli reads the dhi.io credentials from ~/.docker/config.json
      - name: Login to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # The platform bot, not GITHUB_TOKEN: CI runs on its PRs, and
      # bot-auto-merge is able to merge them once green.
      - name: Run Updatecli
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
          UPDATECLI_GITHUB_USERNAME: ${{ secrets.PLATFORM_BOT_USERNAME }}
        shell: bash
        run: updatecli --config .updatecli/updatecli.d ${{ github.event_name == 'schedule' && 'apply' || 'diff' }}
